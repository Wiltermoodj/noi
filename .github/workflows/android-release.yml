name: Android Google Play Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Semantic version name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Integer Google Play versionCode (must increment on every Play upload)"
        required: true
        default: "1"
      require_signing:
        description: "Fail build if upload keystore secrets are not configured (recommended for Play uploads)"
        required: true
        type: boolean
        default: true

jobs:
  build-aab:
    name: Build Signed Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify TypeScript, tests, and Play readiness
        run: |
          npm run typecheck
          npm test
          npm run play:verify

      - name: Build web bundle & sync Capacitor Android
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run android:sync

      - name: Decode upload keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Verify upload signing secrets
        if: ${{ inputs.require_signing }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ] || [ "$HAS_STORE_PASS" != "true" ] || [ "$HAS_KEY_ALIAS" != "true" ] || [ "$HAS_KEY_PASS" != "true" ]; then
            echo "::error::Missing Android upload keystore GitHub Secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See play-store/PLAY_CONSOLE_GUIDE.md."
            exit 1
          fi

      - name: Build release Android App Bundle (.aab)
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/android/upload-keystore.jks', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_REQUIRE_SIGNING: ${{ inputs.require_signing }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Clean up decoded keystore
        if: always()
        run: rm -f android/upload-keystore.jks

      - name: Upload Play Store AAB & R8 mapping artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noi-play-store-release-v${{ inputs.version_name }}-b${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
